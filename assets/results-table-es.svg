<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-labelledby="title desc">
  <title id="title">Tabla de resultados del demo</title>
  <desc id="desc">Demo oficial: 338 de 400 aciertos, 84,5 por ciento y 3,779 puntos. Prueba completa en Colab: 120,576 puntos con 407.260 predicciones de las mismas 400 muestras, a 0,1473 milisegundos de media durante 60 segundos de predict.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#327cda"/>
      <stop offset="1" stop-color="#1f5dae"/>
    </linearGradient>
    <clipPath id="outer"><rect x="1" y="1" width="898" height="188" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#outer)">
    <rect width="900" height="190" fill="#172c49"/>
    <rect x="1" y="1" width="898" height="42" fill="url(#header)"/>
    <rect x="1" y="43" width="898" height="72" fill="#244264"/>
    <rect x="1" y="115" width="898" height="74" fill="#1c3657"/>
    <path d="M570 1V189M1 43H899M1 115H899" stroke="#7194b8" stroke-width="1" opacity=".55"/>
  </g>
  <rect x="1" y="1" width="898" height="188" rx="12" fill="none" stroke="#6f9fd0" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="25" y="28" fill="#fff" font-size="13" font-weight="700" letter-spacing="1.2">EVALUACIÓN</text>
    <text x="594" y="28" fill="#fff" font-size="13" font-weight="700" letter-spacing="1.2">RESULTADO</text>
    <text x="25" y="71" fill="#e5f3ff" font-size="17" font-weight="700">test_demo.npz oficial</text>
    <text x="25" y="95" fill="#a8bfdc" font-size="13">400 muestras distintas</text>
    <text x="594" y="72" fill="#fff" font-size="19" font-weight="700">338 / 400 · 84,5 %</text>
    <text x="594" y="96" fill="#b9d3ec" font-size="14">3,779 puntos</text>
    <text x="25" y="143" fill="#e5f3ff" font-size="17" font-weight="700">Prueba completa de 60 s en Colab</text>
    <text x="25" y="168" fill="#a8bfdc" font-size="13">Las mismas 400 muestras del demo en bucle</text>
    <text x="594" y="151" fill="#fff" font-size="20" font-weight="700">120,576 puntos</text>
    <text x="594" y="175" fill="#b9d3ec" font-size="12">407.260 predicciones · 0,1473 ms de media</text>
  </g>
</svg>
